<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: quitarte la barriga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
/* VOICE: directo, de colega que sabe, sin rollo.
   IDEA: la pizarra del entrenador en el móvil: una pregunta por pantalla y un veredicto grande.
   PICTURE: el resultado: dos barras (tú solo vs con un plan) y la cifra enorme en amarillo.
   COLOUR and TYPE: casi negro, amarillo #fff353 de marca, blanco. Archivo Black + Montserrat + Playfair italic para la palabra clave.
   LAYOUT: una columna de móvil, centrada, máx. 560px. */
:root{color-scheme:dark;--bg:#111111;--panel:#1b1b1b;--line:#2c2c2c;--ink:#ffffff;--soft:#bdb9a6;--y:#fff353;--yh:#e8d400}
:root[data-theme=light]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(90% 50% at 50% 105%,rgba(255,243,83,.22),rgba(255,243,83,0) 70%),var(--bg);background-attachment:fixed;color:var(--ink);
  font:16px/1.5 Montserrat,system-ui,sans-serif;overflow-x:clip}
.app{max-width:560px;margin:0 auto;padding:22px 20px 40px;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px var(--y)}
.top b{font-weight:800;font-size:15px;letter-spacing:-.01em}
.top span{display:block;color:var(--soft);font-size:13px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;margin:20px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);border-radius:6px;transition:width .35s ease}
.step{color:var(--soft);font-size:13px;font-weight:600}
h1,h2{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.5px;line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,9vw,48px)}
h2{font-size:clamp(26px,7vw,34px)}
.k{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:800;text-transform:none;color:var(--y);letter-spacing:-.01em}
.lead{color:#e9e6d6;font-weight:600;font-size:17px;margin:14px 0 0}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0}
.opts{display:grid;gap:12px;margin-top:24px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;
  font-weight:700;font-size:17px;line-height:1.25;min-height:44px;transition:border-color .15s,transform .15s}
.opt:hover{border-color:#4a4a3a}.opt:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #5a5a5a}
.opt.on{border-color:var(--y)}.opt.on .dot{background:var(--y);border-color:var(--y);box-shadow:inset 0 0 0 4px var(--panel)}
.fields{display:grid;gap:14px;margin-top:24px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
label small{color:var(--soft);font-weight:600}
.num{display:flex;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:0 16px}
.num:focus-within{border-color:var(--y)}
.num input{all:unset;flex:1;font:800 22px Montserrat,sans-serif;padding:13px 0;color:#fff;width:100%}
.num span{color:var(--soft);font-weight:700}
.err{color:#ff8a70;font-weight:700;font-size:14px;min-height:20px;margin-top:8px}
.btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--y);color:#111;
  font:900 18px 'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:.2px;border-radius:999px;padding:18px 26px;min-height:44px;box-shadow:0 6px 0 var(--yh);margin-top:24px;width:100%;box-sizing:border-box}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--yh)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ghost{all:unset;cursor:pointer;color:var(--soft);font-weight:700;font-size:15px;text-align:center;padding:12px;margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.big{font-family:'Archivo Black',sans-serif;font-size:clamp(64px,20vw,104px);line-height:.9;color:var(--y);letter-spacing:-2px;margin-top:8px}
.big small{font-size:.32em;letter-spacing:0;color:#fff;margin-left:8px}
.compare{display:grid;gap:14px;margin-top:22px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px}
.row b{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:6px}
.row b em{font-style:normal;white-space:nowrap}
.track{height:16px;background:#262626;border-radius:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.solo i{background:#6d6a5b}.plan i{background:var(--y)}
.freno{margin-top:16px;background:#fff;color:#111;border-radius:18px;padding:16px 18px}
.freno small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#5c5410}
.freno p{margin:4px 0 0;font-weight:800;font-size:19px;line-height:1.25}
.note{color:var(--soft);font-size:13px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#fff;color:#111;font-weight:800;font-size:14px;padding:12px 18px;border-radius:999px;transition:transform .3s,opacity .3s;opacity:0;z-index:9;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.cover .pill{display:inline-block;background:var(--y);color:#111;font:900 13px 'Archivo Black',sans-serif;text-transform:uppercase;padding:7px 12px;border-radius:10px;box-shadow:0 4px 0 var(--yh);margin-bottom:16px}
.ticks{display:grid;gap:8px;margin-top:20px;padding:0;list-style:none}
.ticks li{display:flex;gap:10px;font-weight:700;color:#e9e6d6}
.ticks li::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;background:var(--y);margin-top:2px;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>') center/14px no-repeat,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude}
@media (prefers-reduced-motion:reduce){.track i,.bar i,.toast{transition:none}}
</style>
</head>

  <div class="bar" id="barw"><i id="bar" style="width:0"></i></div>
  <div class="step" id="step">&nbsp;</div>
  <main class="screen" id="screen"></main>
</div>
<div class="toast" id="toast"></div>
<script>
{
const IG = "https://ig.me/m/jordisarrio_coach";
const Q = [
  {id:"train", t:"¿Cómo entrenas ahora mismo?", o:["No entreno","Voy al gym, pero sin progresión","Entreno fuerza con un plan que progresa"]},
  {id:"diet", t:"¿Y con la comida?", o:["Como a ojo, lo que pille","Intento comer sano, pero sin medir","Sigo un plan con cantidades"]},
  {id:"weekend", t:"¿Qué pasa los fines de semana?", o:["Me lo salto todo","A veces me paso","Lo llevo controlado"]},
  {id:"sleep", t:"¿Cuánto duermes de media?", o:["Menos de 6 horas","Entre 6 y 7 horas","7 horas o más"]},
  {id:"steps", t:"¿Cuánto te mueves en el día a día?", o:["Menos de 5.000 pasos","Entre 5.000 y 8.000","Más de 8.000 pasos"]},
];
const W8 = {diet:.35, weekend:.25, train:.2, sleep:.1, steps:.1};
const FRENO = {
  diet:"Comer a ojo, sin un plan con cantidades.",
  weekend:"Los fines de semana: deshacen lo que haces de lunes a viernes.",
  train:"Entrenar sin progresión (o no entrenar fuerza).",
  sleep:"Dormir poco: dispara el hambre y frena la recuperación.",
  steps:"Moverte poco fuera del gym."
};
const A = {}; let i = -1;
const $ = s => document.getElementById(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOTAL = Q.length + 1;

function progress(){
  const n = Math.max(0, i + 1);
  $("bar").style.width = (i < 0 ? 0 : Math.min(100, n / TOTAL * 100)) + "%";
  $("step").textContent = i < 0 ? " " : (i < TOTAL ? `Pregunta ${n} de ${TOTAL}` : "Tu resultado");
}

function cover(){
  i = -1; progress();
  $("screen").innerHTML = `<div class="cover">
    <span class="pill">Test gratis · 1 minuto</span>
    <h1>¿Cuánto tardarás en quitarte <span class="k">la barriga?</span></h1>
    <p class="lead">Descubre en cuántas semanas puedes quitártela con tus hábitos de ahora… y cuánto antes con un plan bien hecho.</p>
    <ul class="ticks"><li>6 preguntas rápidas</li><li>Resultado al momento</li><li>Te dice qué es lo que más te frena</li></ul>
    <button class="btn" id="go">Empezar el test</button></div>`;
  $("go").onclick = () => { i = 0; body(); };
}

function body(){
  progress();
  if (i === 0) return medidas();
  const q = Q[i - 1];
  $("screen").innerHTML = `<h2>${esc(q.t)}</h2>
    <div class="opts">${q.o.map((t, k) => `<button class="opt${A[q.id] === k ? " on" : ""}" data-k="${k}"><span class="dot"></span>${esc(t)}</button>`).join("")}</div>
    <div class="nav"><button class="ghost" id="back">← Atrás</button><span></span></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    A[q.id] = +b.dataset.k;
    document.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b));
    setTimeout(() => { i++; i > Q.length ? result() : body(); }, 220);
  });
  $("back").onclick = () => { i--; body(); };
}

function medidas(){
  $("screen").innerHTML = `<h2>Tus medidas</h2>
    <p class="lead" style="font-size:15px">Solo para calcular tu grasa. No se guardan en ningún sitio. Si no sabes tu cintura, déjala vacía.</p>
    <div class="fields">
      <div><label for="h">Altura</label><div class="num"><input id="h" inputmode="decimal" placeholder="178" value="${A.h||""}"><span>cm</span></div></div>
      <div><label for="w">Peso</label><div class="num"><input id="w" inputmode="decimal" placeholder="88" value="${A.w||""}"><span>kg</span></div></div>
      <div><label for="c">Cintura <small>· opcional, a la altura del ombligo</small></label><div class="num"><input id="c" inputmode="decimal" placeholder="98" value="${A.c||""}"><span>cm</span></div></div>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="next">Siguiente</button>
    <button class="ghost" id="back">← Atrás</button>`;
  $("next").onclick = () => {
    const n = id => parseFloat(String($(id).value).replace(",", "."));
    const h = n("h"), w = n("w"), c = n("c");
    if (!(h >= 140 && h <= 215)) return $("err").textContent = "Pon tu altura en centímetros (por ejemplo, 178).";
    if (!(w >= 45 && w <= 200)) return $("err").textContent = "Pon tu peso en kilos (por ejemplo, 88).";
    if (!isNaN(c) && !(c >= 60 && c <= 170)) return $("err").textContent = "Pon tu cintura en centímetros (por ejemplo, 98), o déjala vacía.";
    Object.assign(A, {h, w, c}); i = 1; body();
  };
  $("back").onclick = cover;
}

function fmt(weeks){
  if (weeks > 104) return {n:"+2", u:"años"};
  if (weeks > 16) return {n:String(Math.round(weeks / 4.345)), u:"meses"};
  return {n:String(Math.round(weeks)), u:"semanas"};
}
function txt(f){ return `${f.n} ${f.u}`; }
function art(f){ return f.u === "años" ? "más de 2 años" : (f.u === "meses" ? `unos ${f.n} meses` : `unas ${f.n} semanas`); }

function result(){
  i = TOTAL; progress();
  const bmi = A.w / Math.pow(A.h / 100, 2);
  const est = isNaN(A.c) ? 1.2 * bmi + 0.23 * 27 - 16.2              // sin cintura: estimación por IMC (menos precisa)
                         : 64 - 20 * (A.h / A.c);                      // con cintura: masa grasa relativa (más precisa)
  const rfm = Math.min(45, Math.max(6, est));
  const target = 14;                                                // % aprox. para que no se note barriga
  const fat = Math.max(0, A.w * (rfm - target) / (100 - target));  // kg de grasa a perder
  let f = 0; for (const k in W8) f += W8[k] * (A[k] / 2);           // 0 = hábitos que frenan, 1 = hábitos de plan
  const ratePlan = rfm > 20 ? 0.55 : 0.4;                           // kg de grasa por semana con un plan
  const rateSolo = 0.06 + 0.3 * f;                                  // por tu cuenta, con tus hábitos actuales
  const near = fat < 1.5;
  const wPlan = near ? 6 : Math.ceil(fat / ratePlan) + 2;
  const wSolo = near ? Math.max(8, Math.ceil(6 / Math.max(.3, f))) : Math.max(wPlan * 1.4, Math.ceil(fat / rateSolo));
  let worst = null, ws = 9;
  for (const k of ["diet","weekend","train","sleep","steps"]) { const s = A[k] / 2 - W8[k] * .01; if (s < ws) { ws = s; worst = k; } }
  const P = fmt(wPlan), S = fmt(wSolo);
  const msg = `Hice el test: con mis hábitos de ahora tardaría ${art(S)} en quitarme la barriga, y con un plan ${art(P)}. Lo que más me frena: ${FRENO[worst].replace(/\.$/, "").toLowerCase()}.`;
  const pct = Math.min(100, wPlan / wSolo * 100);
  $("screen").innerHTML = `
    <h2>${near ? "Estás más cerca de lo que crees" : "Con un plan bien hecho:"}</h2>
    <div class="big">${esc(P.n)}<small>${esc(P.u)}</small></div>
    <p class="lead">${near ? "Te faltan los últimos detalles para que se note el abdomen." : `Calculamos que te sobran unos <b>${Math.round(fat)} kg de grasa</b>.`}</p>
    <div class="compare">
      <div class="row solo"><b>Por tu cuenta, como ahora <em>${esc(txt(S))}</em></b><div class="track"><i id="t1"></i></div></div>
      <div class="row plan"><b>Con un plan <em>${esc(txt(P))}</em></b><div class="track"><i id="t2"></i></div></div>
    </div>
    <div class="freno"><small>Lo que más te frena</small><p>${esc(FRENO[worst])}</p></div>
    <p class="lead" style="margin-top:22px">Mándame tu resultado por privado y te digo qué cambiaría primero en tu caso.</p>
    <a class="btn" id="send" href="${IG}" target="_blank" rel="noopener">Enviarme el resultado</a>
    <p class="note">Al pulsar, tu resultado se copia: pégalo en el chat y envíamelo. Es una estimación orientativa a partir de tu altura, peso${isNaN(A.c) ? "" : " y cintura"}; no es un diagnóstico médico.${isNaN(A.c) ? " Con tu cintura el cálculo sería más preciso." : ""}</p>
    <button class="ghost" id="again">Repetir el test</button>`;
  requestAnimationFrame(() => setTimeout(() => { $("t1").style.width = "100%"; $("t2").style.width = pct + "%"; }, 60));
  $("send").addEventListener("click", () => {
    try { navigator.clipboard.writeText(msg).then(() => toast("Resultado copiado: pégalo en el chat"), () => toast("Escríbeme «TEST» y tu resultado")); }
    catch (e) { toast("Escríbeme «TEST» y tu resultado"); }
  });
  $("again").onclick = () => { for (const k in A) delete A[k]; cover(); };
}

let tt;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 3200); }

cover();
}
</script>
</body>
</html>
